<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Bloodroot — Episode 1</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,520;0,9..144,680;1,9..144,560&family=Outfit:wght@400;500;700&display=swap">
<style>
/* Layout: a cinematic scene above a narration-and-choices dock, in the shape of a Telltale episode. */
:root{
  color-scheme:dark;
  --ink:#090807; --bark:#14110e; --panel:#1b1612; --line:#4a3f32; --cream:#f6efe4; --mist:#cbbfa8;
  --lamp:#e7a64a; --ember:#c4621a; --bruise:#cbb6ee; --moss:#243028; --rust:#c45a45;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --ui:"Outfit",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0; overflow-anchor:none}
body{
  min-height:100dvh; background:
    radial-gradient(90vmax 42vmax at 50% -12%, #2c2418 0%, transparent 58%),
    var(--ink);
  color:var(--cream); font-family:var(--ui); font-weight:400;
  padding:clamp(16px,3vw,28px) max(16px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--lamp); outline-offset:3px}
.shell{width:min(980px,100%); margin:0 auto; display:flex; flex-direction:column; gap:14px}
@media (min-width:860px) and (min-height:720px){
  .shell{width:min(980px, calc((100dvh - 300px) * 16 / 9))}
}
header{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap}
.home{color:var(--mist); text-decoration:none; font-size:13px; letter-spacing:.08em; text-transform:uppercase}
.home:hover{color:var(--cream)}
.brand{margin:4px 0 0; color:var(--lamp); letter-spacing:.2em; text-transform:uppercase; font-size:12px; font-weight:500}
.shell.is-title #title,.shell.is-title #sub{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%)}
h1{margin:2px 0 0; font:520 clamp(28px,5vw,46px)/1.05 var(--display); text-wrap:balance}
.sub{margin:4px 0 0; color:var(--mist); font-size:13px}
#restart{
  background:transparent; border:1px solid var(--line); color:var(--cream);
  border-radius:999px; padding:8px 14px; font-weight:500;
}
#restart:hover{border-color:var(--lamp)}
.flags{display:flex; flex-wrap:wrap; gap:8px}
.flags:empty{display:none}
.flag{
  color:var(--bruise); background:#2a2038; border:1px solid #6d5a88;
  border-radius:999px; padding:4px 10px; font-size:13px; font-weight:500;
}
.notice{
  display:flex; flex-wrap:wrap; gap:8px 12px; align-items:baseline;
  border:1px solid #d7b15a66; background:linear-gradient(90deg,#3a2a12,#1a140e);
  color:#f0d48a; border-radius:10px; padding:10px 14px;
}
.notice b{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--lamp); font-weight:700}
.frame{
  position:relative; border-radius:12px; overflow:hidden;
  border:1px solid #3a3228; background:#0c0a08;
  box-shadow:0 18px 50px #000a;
  width:min(100%, calc(min(50vh, 520px) * 16 / 9));
}
.frame img{display:block; width:100%; height:auto}
.vignette{
  position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 52%, #00000073 100%);
}
.hero-copy{
  position:absolute; left:0; right:0; bottom:0; padding:22px 22px 18px;
  background:linear-gradient(transparent, #090807e6 70%);
  pointer-events:none;
}
.eyebrow{margin:0; letter-spacing:.18em; text-transform:uppercase; font-size:12px; color:var(--lamp); font-weight:500}
.hero-copy h2{margin:4px 0 0; font:680 clamp(48px,9vw,84px)/.9 var(--display); font-style:italic}
.episode{margin:6px 0 0; font:560 clamp(16px,2.4vw,22px)/1.3 var(--display)}
.episode span{color:var(--mist)}
.caption{margin:-6px 2px 0; color:var(--mist); font-size:13px}
.hot{
  position:absolute; margin:0; padding:0;
  background:rgba(231,166,74,.12);
  border:2px solid rgba(244,224,180,.92);
  border-radius:6px;
  box-shadow:0 0 0 1px #0008;
  animation:pulse 2.6s ease-in-out infinite;
}
.hot .tag{
  position:absolute; left:4px; top:4px; pointer-events:none;
  font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  background:#120e0ce6; color:var(--cream); border-radius:4px; padding:2px 6px;
  white-space:nowrap;
}
.hot:hover,.hot:focus-visible{background:rgba(176,140,230,.28); border-color:#e6d6ff}
.hot[aria-pressed="true"]{background:rgba(176,140,230,.34); border-color:#e6d6ff; animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 1px #0008, 0 0 18px rgba(231,166,74,.55)}}
#stage{display:flex; flex-direction:column; align-items:center}
.caption{width:100%}
.inspect{
  background:#221c2c; border:1px solid #6d5a88; border-radius:12px; padding:14px 16px;
}
.inspect .kicker{margin:0; color:var(--bruise); letter-spacing:.14em; text-transform:uppercase; font-size:11px; font-weight:700}
.inspect h2{margin:4px 0 6px; font:560 22px/1.2 var(--display)}
.inspect p{margin:0; color:var(--cream); line-height:1.45}
.inspect button{
  margin-top:10px; background:transparent; border:1px solid #6d5a88; color:var(--cream);
  border-radius:999px; padding:6px 12px; font-weight:500;
}
#narration{
  margin:0; white-space:pre-wrap;
  font:560 clamp(17px,2.05vw,20px)/1.55 var(--display);
  background:var(--bark); border:1px solid #3a3228; border-radius:12px; padding:18px 20px;
}
#narration:empty{display:none}
.epilogue{border-radius:12px; padding:14px 16px; border:1px solid}
.epilogue.complete{background:#1c2418; border-color:#6d8a55; color:#e4f0d4}
.epilogue.short{background:#2a1612; border-color:#a85a48; color:#f6ddd6}
.epilogue b{display:block; margin-bottom:4px; letter-spacing:.14em; text-transform:uppercase; font-size:11px; font-weight:700}
.prompt{margin:2px 0 0; color:var(--mist); font-size:13px; letter-spacing:.12em; text-transform:uppercase; font-weight:500}
.choices{display:flex; flex-direction:column; gap:8px}
.choice{
  display:flex; gap:12px; align-items:baseline; text-align:left; width:100%;
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:13px 16px; min-height:52px; color:var(--cream); font-weight:500; font-size:16px; line-height:1.35;
}
.choice .n{color:var(--lamp); font-weight:700; min-width:1.1em; font-variant-numeric:tabular-nums}
.choice:hover{border-color:var(--lamp); background:#262017}
.choice.lead{
  background:linear-gradient(90deg,#6a3a16,#3a2414);
  border-color:var(--lamp); box-shadow:0 5px 0 #4a250c;
}
.choice.lead:hover{filter:brightness(1.06)}
.choice.lead:active{transform:translateY(4px); box-shadow:0 1px 0 #4a250c}
.foot{margin:0; color:#8d8172; font-size:13px; line-height:1.45}
.missing{padding:28px; color:var(--mist)}
@media (prefers-reduced-motion:reduce){
  .hot{animation:none}
  .choice.lead:active{transform:none}
}
@media (max-width:640px){
  .choice{font-size:15px}
  .hot .tag{font-size:10px}
}
</style>
</head>

    hotspots: [
      { id: "door", label: "Door", x: 1, y: 4, w: 27, h: 92, title: "D.R. 2015", body: "Old oak, iron bands. A hollow shaped exactly like the bloom." },
      { id: "key", label: "Flower", x: 37, y: 46, w: 16, h: 20, title: "The key", body: "It fits the hollow. It wants to." },
    ],
    choices: [
      { label: "Press the flower into the door", next: "s8" },
      { label: "Trust Pell — leave the door shut", next: "end_tp" },
      { label: "Let Ruth press the flower in", next: "s8", notice: "Ruth opens Dad's door.", setFlags: { gaveFlowerToRuth: true } },
    ],
  },
  s7a: {
    id: "s7a",
    title: "Down Alone",
    img: "s7",
    narration: "Amber climbs alone. The D.R. 2015 door waits. Pell's voice drifts down. Without Ruth's whisper, Kenny's doubt is louder.",
    choices: [
      { label: "Press the flower into the door", next: "s8" },
      { label: "Trust Pell — climb back up", next: "end_tp" },
    ],
  },
  end_tp: {
    id: "end_tp",
    title: "The Door Stays Shut",
    img: "s7",
    ending: true,
    narration: "Amber pulls the jar away. Pell's relief is almost tender. The bloom goes into a sealed case. Ruth is gone. \"One day I'll tell you what woke up the last time it opened.\" He never does. Not in Episode 1.\n\n— Short ending —",
    epilogue: "You trusted Pell. Restart to open the door.",
    choices: [{ label: "Restart Episode 1", next: "title" }],
  },
  s8: {
    id: "s8",
    title: "They're All Awake Now",
    img: "s8",
    ending: true,
    narration:
      "The flower fits the hollow. Silver veins pour into the wood. D.R. blazes white. The door swings on warm air that smells like spring.\n\nAn underground greenhouse. Grow lamps. Seed jars in Dad's hand. Hundreds of bruise-purple flowers turning toward Amber. A camcorder: Tape #3. \"Amber, press play.\"\n\nRuth exhales eleven years. Kenny: \"Dad built this?\"\n\nBoots on stone. Pell — rain on his glasses — looks at the garden. Not greedy. Terrified.\n\n\"Oh no. Amber, they're all awake now.\"\n\n— End of Episode 1 —",
    epilogue: "Canon close: Ruth trusts you. Angie's memory stands. Kenny is safe, for now. Episode 2 begins when Amber presses play.",
    choices: [{ label: "Play again from the title", next: "title" }],
  },
};

const CANON = "Canon path: tell Pell the truth → lean into the flower → hide the note → go to the well alone → ask Ruth about Dad → climb down together → press the flower into the door.";

const $ = (id) => document.getElementById(id);
let sceneId = "title";
let flags = { ...START_FLAGS };
let notice = null;
let inspect = null;

function restart() {
  flags = { ...START_FLAGS };
  notice = null;
  inspect = null;
  sceneId = "title";
  render(true);
}

function go(choice) {
  if (choice.next === "title") { restart(); return; }
  if (choice.setFlags) flags = { ...flags, ...choice.setFlags };
  notice = choice.notice || null;
  inspect = null;
  sceneId = choice.next;
  render(true);
}

function scene() {
  return SCENES[sceneId] || SCENES.title;
}

function render(sceneChanged) {
  const s = scene();
  const onTitle = s.id === "title";
  document.title = onTitle ? "Bloodroot — Episode 1" : s.title + " — Bloodroot";
  document.querySelector(".shell").classList.toggle("is-title", onTitle);
  $("title").textContent = onTitle ? "Bloodroot" : s.title;
  $("sub").textContent = onTitle
    ? "Episode 1 — The Late Shipment"
    : "Selectable choices · click the outlined places";
  $("restart").hidden = onTitle;

  const flagBox = $("flags");
  flagBox.replaceChildren();
  for (const [key, label] of FLAG_LABELS) {
    if (!flags[key]) continue;
    const chip = document.createElement("span");
    chip.className = "flag";
    chip.textContent = label;
    flagBox.appendChild(chip);
  }

  const note = $("notice");
  note.hidden = !notice;
  note.replaceChildren();
  if (notice) {
    const k = document.createElement("b");
    k.textContent = "Relationship";
    const t = document.createElement("span");
    t.textContent = notice;
    note.append(k, t);
  }

  renderStage(s);
  renderInspect();
  if (sceneChanged || $("narration").textContent === "") $("narration").textContent = s.narration;

  const epi = $("epilogue");
  epi.replaceChildren();
  epi.className = "";
  if (s.ending && s.epilogue) {
    epi.className = "epilogue " + (s.id === "s8" ? "complete" : "short");
    const k = document.createElement("b");
    k.textContent = s.id === "s8" ? "Episode complete" : "Ending";
    const t = document.createElement("span");
    t.textContent = s.epilogue;
    epi.append(k, t);
  }

  const box = $("choices");
  box.replaceChildren();
  if (!onTitle && s.choices) {
    const prompt = document.createElement("p");
    prompt.className = "prompt";
    prompt.textContent = "What does Amber do?";
    box.appendChild(prompt);
  }
  (s.choices || []).forEach((choice, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "choice" + (i === 0 ? " lead" : "");
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = String(i + 1);
    const label = document.createElement("span");
    label.textContent = choice.label;
    b.append(n, label);
    b.addEventListener("click", () => go(choice));
    box.appendChild(b);
  });

  $("foot").textContent = onTitle ? CANON : "";

  if (sceneChanged) {
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  }
}

function renderStage(s) {
  const stage = $("stage");
  stage.replaceChildren();
  const key = s.id === "title" ? "s8" : s.img;
  if (!key || !IMGS[key]) return;
  const frame = document.createElement("div");
  frame.className = "frame";
  const img = document.createElement("img");
  img.src = IMGS[key];
  img.width = 1280;
  img.height = 720;
  img.alt = s.id === "title"
    ? "Underground greenhouse at the end of Episode 1, purple flowers turning toward an open door marked D.R."
    : s.title;
  img.addEventListener("error", () => {
    const p = document.createElement("p");
    p.className = "missing";
    p.textContent = img.alt + " (scene art missing)";
    img.replaceWith(p);
  });
  frame.appendChild(img);
  const shade = document.createElement("div");
  shade.className = "vignette";
  frame.appendChild(shade);

  if (s.id === "title") {
    const copy = document.createElement("div");
    copy.className = "hero-copy";
    copy.innerHTML = '<p class="eyebrow">Hollins Ridge, near Lynchburg</p><h2>Bloodroot</h2><p class="episode">Episode 1 <span>— The Late Shipment</span></p>';
    frame.appendChild(copy);
    stage.appendChild(frame);
    const cap = document.createElement("p");
    cap.className = "caption";
    cap.textContent = "Canon path ends at Dad's underground greenhouse.";
    stage.appendChild(cap);
    return;
  }

  (s.hotspots || []).forEach((h) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "hot";
    b.style.left = h.x + "%";
    b.style.top = h.y + "%";
    b.style.width = h.w + "%";
    b.style.height = h.h + "%";
    b.title = h.label;
    b.setAttribute("aria-label", "Inspect " + h.label);
    b.setAttribute("aria-pressed", inspect && inspect.id === h.id ? "true" : "false");
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = h.label;
    b.appendChild(tag);
    b.addEventListener("click", () => {
      inspect = inspect && inspect.id === h.id ? null : h;
      render(false);
    });
    frame.appendChild(b);
  });
  stage.appendChild(frame);
}

function renderInspect() {
  const slot = $("inspect");
  slot.replaceChildren();
  if (!inspect) return;
  const card = document.createElement("div");
  card.className = "inspect";
  const k = document.createElement("p");
  k.className = "kicker";
  k.textContent = "Looking closer";
  const h = document.createElement("h2");
  h.textContent = inspect.title;
  const p = document.createElement("p");
  p.textContent = inspect.body;
  const close = document.createElement("button");
  close.type = "button";
  close.textContent = "Close";
  close.addEventListener("click", () => { inspect = null; render(false); });
  card.append(k, h, p, close);
  slot.appendChild(card);
}

$("restart").addEventListener("click", restart);
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Escape" && inspect) { inspect = null; render(false); return; }
  const n = Number(e.key);
  const choices = scene().choices || [];
  if (n >= 1 && n <= choices.length) go(choices[n - 1]);
});

render(false);
</script>
</body>
</html>
