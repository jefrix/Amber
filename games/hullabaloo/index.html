<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hullabaloo</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chango&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed low-resolution 3D stage, with a carnival-poster overlay above it. */
:root{
  color-scheme:dark;
  --ink:#1b1030; --plum:#35205c; --brass:#f2b632; --cream:#fff3d6; --rose:#ff5a6e; --teal:#3fd6c4; --dim:#b9a8d8;
  --display:"Chango","Arial Black",Impact,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--cream);overflow:hidden;font-family:var(--mono);overscroll-behavior:none;touch-action:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
#hud{position:fixed;inset:0 0 auto;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;pointer-events:none;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-weight:500;text-shadow:0 2px 0 #000;font-size:15px;font-variant-numeric:tabular-nums}
#hud div{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
#hearts{color:var(--rose);font-size:21px;letter-spacing:2px}
#hudR{justify-content:flex-end;text-align:right}
#hudR button{pointer-events:auto;background:#0007;border:1px solid #fff5;border-radius:4px;padding:2px 9px}
#toast{position:fixed;left:50%;bottom:18%;transform:translateX(-50%);width:min(90vw,620px);text-align:center;font-size:15px;line-height:1.45;text-shadow:0 2px 0 #000,0 0 8px #000;pointer-events:none}
#card{position:fixed;left:0;right:0;top:24%;text-align:center;pointer-events:none;font-family:var(--display);font-size:clamp(30px,7vw,68px);color:var(--brass);text-shadow:0 4px 0 #6a2a00,0 8px 0 #0006;line-height:1.05;padding-inline:16px}
#card small{display:block;font:500 15px var(--mono);color:var(--cream);letter-spacing:.14em;text-transform:uppercase;text-shadow:0 2px 0 #000;margin-bottom:8px}
.screen{position:fixed;inset:0;overflow:auto;touch-action:pan-y;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:20px;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(#1b103000,#1b1030e0 62%)}
.screen.solid{background:#1b1030e8}
h1{font:400 clamp(44px,12.5vw,132px)/.95 var(--display);margin:0;color:var(--brass);text-shadow:0 5px 0 #a13c0c,0 10px 0 #35205c;display:flex;flex-wrap:wrap;justify-content:center}
h1 span{display:inline-block;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{50%{transform:translateY(-7px) rotate(-3deg)}}
@media (prefers-reduced-motion:reduce){h1 span{animation:none}}
h2{font:400 clamp(26px,5vw,44px)/1.05 var(--display);margin:0;color:var(--brass);text-align:center;text-wrap:balance}
p{margin:0;max-width:62ch;line-height:1.55;text-align:center}
.big{font:400 20px var(--display);background:var(--rose);color:#2b0614;border:0;border-radius:6px;padding:12px 26px;box-shadow:0 5px 0 #8e1b35}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 #8e1b35}
.quiet{background:transparent;border:1px solid var(--dim);border-radius:6px;padding:8px 14px}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:stretch}
.keys{color:var(--dim);font-size:13px;text-align:center;line-height:1.7}
kbd{font:inherit;color:var(--cream);border:1px solid var(--dim);border-radius:3px;padding:0 5px}
.stops{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;width:min(100%,820px)}
.stop{background:var(--plum);border:2px solid var(--dim);border-radius:6px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0}
.stop b{font:400 18px var(--display);color:var(--brass)}
.stop span{font-size:13px;color:var(--dim);line-height:1.4}
.stop[disabled]{opacity:.45;cursor:not-allowed}
.stop.on{border-color:var(--teal)}
.who{background:var(--plum);border:2px solid var(--dim);border-radius:6px;padding:10px 14px;width:min(100%,290px);text-align:left;line-height:1.4}
.who b{display:block;font:400 19px var(--display);color:var(--cream)}
.who[aria-pressed=true]{border-color:var(--brass);background:#553080}
.who span{font-size:13px;color:var(--dim)}
.tally{font-size:20px;text-align:center;line-height:1.7;font-variant-numeric:tabular-nums}
.tally b{color:var(--brass);font-size:30px}
#code{width:7ch;text-transform:uppercase;background:#0005;border:1px solid var(--dim);border-radius:4px;padding:7px;text-align:center}
#touch{position:fixed;inset:auto 0 0;display:none;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding-bottom:calc(max(64px,9vh) + var(--kb,0px) + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
#touch div{display:flex;gap:10px;align-items:flex-end}
#touch button{pointer-events:auto;width:62px;height:62px;border-radius:50%;background:#fff2;border:2px solid #fff6;font-size:20px;touch-action:none;user-select:none;-webkit-user-select:none}
#touch .rgt{position:fixed;right:max(24px,env(safe-area-inset-right,0px));bottom:calc(32% + var(--kb,0px));flex-direction:column;align-items:center}
#touch .jmp{width:72px;height:72px;background:#ff5a6e66}
@media (pointer:coarse){#touch.live{display:flex}#toast{bottom:auto;top:13%;font-size:14px}}
@media (pointer:coarse) and (orientation:landscape){#touch{padding-bottom:calc(18px + var(--kb,0px) + env(safe-area-inset-bottom,0px))}}
</style>
</head>
<body>

<canvas id="stage" aria-label="Game view"></canvas>
<div id="hud" hidden>
  <div><span id="hearts"></span><span id="lives"></span><span id="ammo"></span></div>
  <div id="hudR"><span id="treasure"></span><button id="muteB" type="button">Sound on</button><button id="pauseB" type="button">Pause</button></div>
</div>
<div id="toast" aria-live="polite"></div>
<div id="card" hidden></div>
<div id="touch">
  <div><button id="tL" type="button" aria-label="Run left">◀</button><button id="tR" type="button" aria-label="Run right">▶</button><button id="tU" type="button" aria-label="Take the fork">▲</button></div>
  <div class="rgt"><button id="tA" type="button" aria-label="Action">✦</button><button id="tJ" class="jmp" type="button" aria-label="Jump">⤒</button></div>
</div>
<div id="ui"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ========== Rendering setup ========== */
THREE.ShaderChunk.project_vertex += '\n gl_Position.xy = floor(gl_Position.xy / gl_Position.w * vec2(320.,200.)) / vec2(320.,200.) * gl_Position.w;\n';
const $ = id => document.getElementById(id);
const canvas = $('stage');
let renderer=null;
try { renderer = new THREE.WebGLRenderer({canvas,antialias:false}); }
catch(e){ $('ui').innerHTML='<div class="screen solid"><h2>This game needs WebGL</h2><p>Your browser could not start 3D graphics. Turn on hardware acceleration or try another browser, then reload the page.</p></div>'; throw e; }
renderer.setPixelRatio(1);
const camera = new THREE.PerspectiveCamera(50,16/9,.3,700);
function resize(){
  const w=innerWidth||800,h=innerHeight||450,a=w/h,H=a<1?520:Math.min(400,Math.max(300,h));
  renderer.setSize(Math.round(H*a),H,false);
  camera.aspect=a; camera.fov=a<1?72:50; camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();
function fitBar(){const v=window.visualViewport;if(v)document.documentElement.style.setProperty('--kb',Math.max(0,innerHeight-v.height-v.offsetTop)+'px')}
if(window.visualViewport){visualViewport.addEventListener('resize',fitBar);visualViewport.addEventListener('scroll',fitBar)}fitBar();
const rng=(seed=>()=> (seed=(seed*16807)%2147483647)/2147483647);
const sign0=v=>v>0?1:v<0?-1:0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;

/* Faceted geometry cache, so the low-poly look stays flat-lit */
const facet=g=>{const n=g.index?g.toNonIndexed():g;n.computeVertexNormals();return n};
const GEO={
  box:facet(new THREE.BoxGeometry(1,1,1)), ball:facet(new THREE.IcosahedronGeometry(.5,1)), lump:facet(new THREE.IcosahedronGeometry(.5,0)),
  cone:facet(new THREE.ConeGeometry(.5,1,6)), cone4:facet(new THREE.ConeGeometry(.5,1,4)), cyl:facet(new THREE.CylinderGeometry(.5,.5,1,8)),
  coin:facet(new THREE.CylinderGeometry(.42,.42,.14,8).rotateX(Math.PI/2)), gem:facet(new THREE.OctahedronGeometry(.48,0)),
  gear:facet(new THREE.CylinderGeometry(1,1,.25,10).rotateX(Math.PI/2)), ring:facet(new THREE.TorusGeometry(1.5,.22,6,14)), wing:facet(new THREE.ConeGeometry(.6,1.5,3)),
};
const MATS={};
const mat=c=>MATS[c]||(MATS[c]=new THREE.MeshLambertMaterial({color:c}));
const glow=c=>MATS['g'+c]||(MATS['g'+c]=new THREE.MeshBasicMaterial({color:c}));
function M(geo,c,sx=1,sy=sx,sz=sx,x=0,y=0,z=0,parent=null,g=false){const m=new THREE.Mesh(GEO[geo],g?glow(c):mat(c));m.scale.set(sx,sy,sz);m.position.set(x,y,z);if(parent)parent.add(m);return m}

function paint(kind,a,b,c){
  const cv=document.createElement('canvas');cv.width=cv.height=64;const x=cv.getContext('2d');
  x.fillStyle=a;x.fillRect(0,0,64,64);
  if(kind==='brick'){x.fillStyle=b;for(let r=0;r<4;r++)for(let i=-1;i<3;i++)x.fillRect(i*32+(r%2)*16+1,r*16+1,30,14);x.fillStyle=c;x.fillRect(5,5,8,3);x.fillRect(40,38,10,3)}
  if(kind==='cobble'){x.fillStyle=b;for(let r=0;r<4;r++)for(let i=0;i<4;i++){x.fillRect(i*16+2+(r%2)*3,r*16+2,12,12)}x.fillStyle=c;x.fillRect(6,6,5,3);x.fillRect(38,22,5,3);x.fillRect(22,50,5,3)}
  if(kind==='moss'){const r=rng(9);for(let i=0;i<70;i++){x.fillStyle=r()<.55?b:c;x.fillRect(r()*62|0,r()*62|0,3,3)}}
  if(kind==='bark'){x.fillStyle=b;for(let i=0;i<8;i++)x.fillRect(i*8+1,0,5,64);x.fillStyle=c;x.fillRect(11,12,10,4);x.fillRect(42,44,10,4)}
  if(kind==='plate'){x.fillStyle=b;x.fillRect(2,2,60,60);x.fillStyle=c;[[6,6],[54,6],[6,54],[54,54]].forEach(p=>x.fillRect(p[0],p[1],5,5));x.fillStyle=a;x.fillRect(0,31,64,2);x.fillRect(31,0,2,64)}
  if(kind==='swirl'){x.fillStyle=b;for(let i=0;i<4;i++){x.fillRect(i*16,0,8,64)}x.fillStyle=c;for(let i=0;i<4;i++){x.fillRect(0,i*16+4,64,3)}}
  const t=new THREE.CanvasTexture(cv);t.magFilter=t.minFilter=THREE.NearestFilter;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.generateMipmaps=false;return t;
}

/* ========== Rails: the 2D play surface bent through 3D ========== */
class Rail{
  constructor(pts,closed=false){
    this.closed=closed;
    const c=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],0,p[1])),closed,'catmullrom',.5);
    c.arcLengthDivisions=Math.max(600,pts.length*30);
    this.len=c.getLength();this.n=Math.ceil(this.len/.5);
    this.px=new Float32Array(this.n+1);this.pz=new Float32Array(this.n+1);this.tx=new Float32Array(this.n+1);this.tz=new Float32Array(this.n+1);
    for(let i=0;i<=this.n;i++){const u=i/this.n,p=c.getPointAt(u),t=c.getTangentAt(u);this.px[i]=p.x;this.pz[i]=p.z;const l=Math.hypot(t.x,t.z)||1;this.tx[i]=t.x/l;this.tz[i]=t.z/l}
    this.plats=[];this.cams=[];this.mergeRail=null;this.mergeS=0;
  }
  wrap(s){return this.closed?((s%this.len)+this.len)%this.len:clamp(s,0,this.len)}
  d(a,b){let v=b-a;if(this.closed){v=((v%this.len)+this.len)%this.len;if(v>this.len/2)v-=this.len}return v}
  frame(s){const f=this.wrap(s)/this.len*this.n,i=Math.min(this.n-1,f|0),k=f-i;
    let tx=lerp(this.tx[i],this.tx[i+1],k),tz=lerp(this.tz[i],this.tz[i+1],k);const l=Math.hypot(tx,tz)||1;tx/=l;tz/=l;
    return {x:lerp(this.px[i],this.px[i+1],k),z:lerp(this.pz[i],this.pz[i+1],k),tx,tz,nx:-tz,nz:tx}}
  place(o,s,y,lat=0){const f=this.frame(s);o.position.set(f.x+f.nx*lat,y,f.z+f.nz*lat);o.rotation.y=Math.atan2(-f.tz,f.tx);return f}
}
function trace(segs,x=0,z=0,h=0){const pts=[[x,z]];for(const[len,turn]of segs){const n=Math.max(1,Math.ceil(len/10)),st=len/n;for(let i=0;i<n;i++){h+=turn/n;x+=Math.cos(h)*st;z+=Math.sin(h)*st;pts.push([x,z])}}return pts}
const topAt=(p,s)=>p.t0===p.t1?p.t0:lerp(p.t0,p.t1,clamp((s-p.s0)/(p.s1-p.s0),0,1));

class Batch{
  constructor(){this.p=[];this.u=[]}
  quad(a,b,c,d,ua,ub,uc,ud){this.p.push(...a,...b,...c,...a,...c,...d);this.u.push(...ua,...ub,...uc,...ua,...uc,...ud)}
  mesh(tex,color=0xffffff){if(!this.p.length)return null;const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(this.p,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(this.u,2));g.computeVertexNormals();return new THREE.Mesh(g,new THREE.MeshLambertMaterial({map:tex,color}))}
}
function extrude(rail,p,top,side,hw=1.9){
  const n=Math.max(1,Math.ceil((p.s1-p.s0)/1.5));
  const pt=(s,lat,y)=>{const f=rail.frame(s);return[f.x+f.nx*lat,y,f.z+f.nz*lat]};
  for(let i=0;i<n;i++){
    const a=lerp(p.s0,p.s1,i/n),b=lerp(p.s0,p.s1,(i+1)/n),ta=topAt(p,a),tb=topAt(p,b),u0=a/4,u1=b/4,h=p.bot;
    top.quad(pt(a,hw,ta),pt(b,hw,tb),pt(b,-hw,tb),pt(a,-hw,ta),[u0,1],[u1,1],[u1,0],[u0,0]);
    side.quad(pt(a,hw,h),pt(b,hw,h),pt(b,hw,tb),pt(a,hw,ta),[u0,h/4],[u1,h/4],[u1,tb/4],[u0,ta/4]);
    side.quad(pt(b,-hw,h),pt(a,-hw,h),pt(a,-hw,ta),pt(b,-hw,tb),[u1,h/4],[u0,h/4],[u0,ta/4],[u1,tb/4]);
  }
  if(!rail.closed){const e=(s,sg,t)=>{const A=pt(s,hw,p.bot),B=pt(s,-hw,p.bot),C=pt(s,-hw,t),D=pt(s,hw,t);sg>0?side.quad(B,A,D,C,[0,p.bot/4],[1,p.bot/4],[1,t/4],[0,t/4]):side.quad(A,B,C,D,[1,p.bot/4],[0,p.bot/4],[0,t/4],[1,t/4])};e(p.s0,-1,p.t0);e(p.s1,1,p.t1)}
}

/* ========== World state ========== */
let W=null; // current level
const THEMES={
  town:{sky:[0x241a55,0xff9d6c],fog:0xe58e7a,ground:0x3b3a6a,top:['cobble','#6e5a7e','#9a8aa6','#c0b3c4'],side:['brick','#4a2a3e','#a34f45','#c97a5d'],light:0xffe1bf,amb:0.62,fogD:[70,290],props:'town'},
  wood:{sky:[0x0b0a2c,0x3e2a78],fog:0x31246e,ground:0x161842,top:['moss','#2a6b52','#3fa66a','#7fe08a'],side:['bark','#2a1c40','#493364','#8a64a8'],light:0xa9b8ff,amb:0.78,fogD:[55,220],props:'wood'},
  sky:{sky:[0x2b83d8,0xdff4ff],fog:0xcbe9fb,ground:0xeaf7ff,top:['plate','#6a4a1e','#c99536','#ffe08a'],side:['plate','#5a4a6a','#8a7a9e','#d6c9e8'],light:0xfff4d8,amb:0.72,fogD:[90,340],props:'sky'},
  bell:{sky:[0x1a0824,0xc0303e],fog:0x5e1830,ground:0x1d0a24,top:['plate','#3a2534','#6e4150','#d9a24c'],side:['brick','#1d0d22','#4a2038','#7a3050'],light:0xffc4a0,amb:0.66,fogD:[60,240],props:'bell'},
  whirl:{sky:[0x4a0d78,0xff4fa0],fog:0xc53c9e,ground:0x2f0a5c,top:['swirl','#ffcf33','#ff5a6e','#ffffff'],side:['swirl','#3fd6c4','#2a68d8','#ffffff'],light:0xffffff,amb:0.8,fogD:[60,250],props:'sky'},
};
class Builder{
  constructor(rail,x=0,y=0){this.r=rail;this.x=x;this.y=y;this.l=x}
  pl(o){const p=Object.assign({rail:this.r,kind:'solid',alive:true,dx:0,dy:0},o);if(p.t1===undefined)p.t1=p.t0;if(p.bot===undefined)p.bot=Math.min(p.t0,p.t1)-3.5;this.r.plats.push(p);W.plats.push(p);return p}
  g(len,dy=0){this.last=null;this.y+=dy;this.pl({s0:this.x,s1:this.x+len,t0:this.y});this.l=this.x;this.x+=len;return this}
  fill(dy=0){return this.g(this.r.len-this.x+1,dy)}
  slope(len,dy,slide=false){this.last=this.pl({s0:this.x,s1:this.x+len,t0:this.y,t1:this.y+dy,slide});this.y+=dy;this.l=this.x;this.x+=len;return this}
  coil(s0,len,rise,n=3,slide=false){ // a ribbon wrapped round a landmark, climbing or diving
    if(this.x<s0)this.g(s0-this.x);else if(this.x>s0+4)console.error('coil starts late',s0,this.x);
    const start=this.x,y0=this.y,gapW=slide?0:5,seg=(len-(n-1)*gapW)/n;
    for(let i=0;i<n;i++){this.slope(seg,rise/n,slide);this.last.plank=true;this.last.bot=Math.min(this.last.t0,this.last.t1)-.7;const c=Math.floor(seg/5);for(let k=0;k<c;k++){const q=this.l+2+k*5;this.coin(q,topAt(this.last,q)+1.1,k===c-1&&i%2?1:0)}if(i&&!slide)this.en('fly',seg*.5,3);if(i<n-1&&gapW)this.gap(gapW)}
    let cx=0,cz=0;for(let i=0;i<40;i++){const f=this.r.frame(start+(len*i/40));cx+=f.x/40;cz+=f.z/40}
    W.coils.push({cx,cz,top:Math.max(y0,this.y)});this.last=null;return this}
  gap(w){this.x+=w;return this}
  block(kind,len,dy,extra={}){this.y+=dy;this.pl(Object.assign({s0:this.x,s1:this.x+len,t0:this.y,bot:this.y-.6,kind},extra));this.l=this.x;this.x+=len;return this}
  ow(len,dy=0){return this.block('oneway',len,dy)}
  cr(len,dy=0){return this.block('crumble',len,dy)}
  lift(len,ds,dyA,per=3,ph=0){const s0=this.x+ds;this.pl({s0,s1:s0+len,t0:this.y,bot:this.y-.6,kind:'move',home:[s0,this.y],ds,dyA,per,ph});this.l=this.x;this.x+=len+ds*2;return this}
  shelf(off,len,h){this.pl({s0:this.l+off,s1:this.l+off+len,t0:this.y+h,bot:this.y+h-.6,kind:'oneway'});return this}
  crack(off,h=3.5){this.pl({s0:this.l+off,s1:this.l+off+1.2,t0:this.y+h,bot:this.y,kind:'crack'});return this}
  ent(type,off,o={}){W.ents.push(Object.assign({type,rail:this.r,s:this.l+off,y:this.y,alive:true},o));return this}
  coin(s,y,t=0){W.ents.push({type:'coin',rail:this.r,s,y,tier:t,alive:true,hw:.55,h:1});W.total+=[1,5,25][t];return this}
  row(off,n,t=0,dy=1.1,sp=1.9){for(let i=0;i<n;i++){const q=this.l+off+i*sp;this.coin(q,(this.last?topAt(this.last,q):this.y)+dy,t)}return this}

      case'heart':case'life':case'power':e.rail.place(g,e.s,e.y+Math.sin(t*3)*.12);g.rotation.y+=t*2;break;
      case'enemy':{e.rail.place(g,e.s,e.y);if(e.dir>0&&e.kind!=='spit'){}else if(e.kind!=='spit')g.rotation.y+=Math.PI;if(e.kind==='spit'){if(e.rail.d(e.s,P.s)<0)g.rotation.y+=Math.PI}
        if(e.fz<=0)g.position.y+=Math.abs(Math.sin(e.t*7))*.12;if(g.wings){g.wings[0].rotation.x=1.3+Math.sin(t*22)*.6;g.wings[1].rotation.x=-1.3-Math.sin(t*22)*.6}break}
      case'saw':e.rail.place(g,e.s,e.y+e.yo);g.spin.rotation.z-=dt*14;break;
      case'portal':g.spin.rotation.y+=dt*3;g.spin.rotation.x+=dt*2;break;
      case'fork':g.spin.rotation.y+=dt*3;break;
      case'spring':e.pop=Math.max(0,(e.pop||0)-dt);g.cap.scale.y=.8+e.pop*3;break;
      case'goal':g.bell.rotation.z=Math.sin(t*2.5)*.25;break;
      case'check':if(e.done)g.bell.rotation.z=Math.sin(t*5)*.25;break;
      case'boss':{e.rail.place(g,e.s,e.y);const facing=(e.state==='leap'?e.dirL:(e.rail.d(e.s,P.s)>0?1:-1));if(facing<0)g.rotation.y+=Math.PI;
        g.bodyG.scale.y=e.state==='stun'?.72:1;g.head.rotation.z=e.state==='stun'?-.5+Math.sin(t*9)*.08:Math.sin(t*5)*.06;const s=1+e.hit*.2;g.scale.setScalar(s);break}
    }
  }
  if(W.bellMesh)W.bellMesh.rotation.z=Math.sin(t*.9)*.12;
  if(world&&world.spin)for(const s of world.spin)s.rotation.z+=dt*s.userData.spin;
  for(const q of POOL){if(q.life>0){q.life-=dt;q.vy-=20*dt;q.m.position.x+=q.vx*dt;q.m.position.y+=q.vy*dt;q.m.position.z+=q.vz*dt;q.m.rotation.x+=dt*8;if(q.life<=0)q.m.visible=false}}
  // hero
  P.rail.place(hero,P.s,P.y);if(P.face<0)hero.rotation.y+=Math.PI;
  hero.visible=!(P.inv>0&&(t*14|0)%2);
  const b=hero.body;b.rotation.set(0,0,0);b.position.y=0;
  if(P.roll>0){b.position.y=.9;b.rotation.z=-W.t*22;b.children.forEach(ch=>{});}
  const sw=P.ground?Math.sin(P.anim*1.15)*clamp(Math.abs(P.vx)/6,0,1)*.95:.7;
  if(hero.legs&&hero.legs.length){hero.legs[0].rotation.z=sw;hero.legs[1].rotation.z=-sw;hero.arms[0].rotation.z=-sw*.8;hero.arms[1].rotation.z=sw*.8;if(!P.ground&&P.form==='none'){hero.arms[0].rotation.z=2.2;hero.arms[1].rotation.z=2.2}}
  if(hero.wings){const a=K.j?Math.sin(t*22)*.8:Math.sin(t*5)*.25;hero.wings[0].rotation.x=a;hero.wings[1].rotation.x=-a}
  // shadow
  const fl=floorAt(P.rail,P.s,P.y+.1);shadow.visible=!!fl;if(fl){const ft=topAt(fl,P.s);P.rail.place(shadow,P.s,ft+.06);const k=clamp(1-(P.y-ft)/12,.35,1);shadow.scale.setScalar(k)}
  if(W.skyM)W.skyM.position.copy(camera.position);
  if(W.vortex){if(!W.vobj){W.vobj=new THREE.Group();for(let i=0;i<5;i++){const m=M('ring',i%2?0xff4fa0:0xffcf33,2.2-i*.3,2.2-i*.3,2.2-i*.3,0,0,i*.7,null,true);m.rotation.y=0;W.vobj.add(m)}W.vobj.children.forEach((m,i)=>{m.position.set(-i*.8,4,0);m.rotation.y=Math.PI/2});scene.add(W.vobj)}
    const f=W.vortex.s;P.rail.place(W.vobj,Math.max(.2,f),P.y);W.vobj.children.forEach((m,i)=>m.rotation.x=t*(3+i))}
  renderer.render(scene,camera);
}

/* ========== HUD and screens ========== */
let toastT=0;
function toast(msg,sec=3.2){if(K_touch())msg=msg.replace('← → or A D','◀ ▶').replace(/\bSpace\b/g,'⤒').replace(/\bX\b/g,'✦').replace(/↑/g,'▲');$('toast').textContent=msg;toastT=sec}
function hud(){
  if(!P||!W)return;
  $('hearts').textContent='♥'.repeat(Math.max(0,P.hp))+'♡'.repeat(Math.max(0,3-P.hp));
  $('lives').textContent=CHAR[P.char].name+' × '+Math.max(0,G.lives);
  $('ammo').textContent=P.form!=='none'?({boar:'Boar form',wyvern:'Wyvern form'}[P.form]):P.ammo>0?({fire:'Ember',frost:'Frost',shrink:'Shrink'}[P.power]+' '+P.ammo):'';
  $('treasure').textContent=W.boss?'':'◉ '+W.got+'  ·  '+Math.floor(pct())+'%';
}
const pct=()=>W.total?W.got/W.total*100:0;
function ui(html,solid){$('ui').innerHTML=html?`<div class="screen${solid?' solid':''}">${html}</div>`:''}
function showTouch(v){$('touch').classList.toggle('live',v);$('hud').hidden=!v}
function title(){
  G.state='title';showTouch(false);loadLevel(0,G.char);W.killY=-40;W.intro=0;
  const word='Hullabaloo!'.split('').map((c,i)=>`<span style="animation-delay:${i*.09}s">${c}</span>`).join('');
  ui(`<h1 aria-label="Hullabaloo!">${word}</h1>
   <p>Two apprentices rang the Thirteenth Bell of Tollbury, and the town folded into a single twisting ribbon. Run it, flip off it, swap heroes at every stop, and unring that bell.</p>
   <div class="row"><button class="big" id="go" type="button">Play</button><a class="quiet" href="../../" style="text-decoration:none;align-self:center">Back to Amber's page</a></div>
   <p class="keys"><kbd>←</kbd> <kbd>→</kbd> run &nbsp; <kbd>Space</kbd> jump &nbsp; <kbd>X</kbd> action &nbsp; <kbd>↑</kbd> take a fork &nbsp; <kbd>P</kbd> pause &nbsp; <kbd>M</kbd> sound. Touch buttons appear on phones.</p>`);
  $('go').onclick=()=>{Sound.boot();map()};
}
function map(msg=''){
  G.state='map';showTouch(false);
  const stops=LEVELS.filter(l=>!l.bonus).map((l,i)=>{const open=i<=G.cleared;const b=G.best[i];return `<button class="stop" data-i="${i}" type="button"${open?'':' disabled'}><b>${i+1}. ${open?l.name:'Locked'}</b><span>${open?l.blurb:'Clear the stop before this one.'}</span><span>${open&&b!==undefined&&!l.boss?'Best treasure '+b+'%':''}</span></button>`}).join('');
  const who=k=>`<button class="who" data-c="${k}" aria-pressed="${G.char===k}" type="button"><b>${CHAR[k].name}</b><span>${k==='wren'?'Quick and light. Jumps twice in the air, so she reaches high treasure.':'Stout and stubborn. Rolls with X through enemies and cracked walls, and once in mid-air.'}</span></button>`;
  ui(`<h2>Who runs the next stop?</h2><div class="row">${who('wren')}${who('mott')}</div><h2>The Ribbon Map</h2><div class="stops">${stops}</div>
  ${msg?`<p>${msg}</p>`:''}
  <form id="cf" class="row"><label for="code" style="align-self:center">Optional: skip ahead with a stop code</label><input id="code" maxlength="4" autocomplete="off" aria-label="Stop code"><button class="quiet" type="submit">Enter</button></form>`,true);
  document.querySelectorAll('.who').forEach(b=>b.onclick=()=>{G.char=b.dataset.c;save();map()});
  document.querySelectorAll('.stop').forEach(b=>b.onclick=()=>{if(!b.disabled)play(+b.dataset.i)});
  $('cf').onsubmit=e=>{e.preventDefault();const v=$('code').value.trim().toUpperCase(),i=LEVELS.findIndex(l=>l.code===v);if(i>=0){G.cleared=Math.max(G.cleared,i);save();map('Code accepted. '+LEVELS[i].name+' is open.')}else map('That code does not match a stop. Codes are four letters and appear after each clear.')};
}
function play(i,char){
  G.lvl=i;G.lives=Math.max(G.lives,G.auto?3:G.lives<0?3:G.lives);if(G.lives<0)G.lives=3;
  loadLevel(i,char||G.char);
  let lo=1e9;for(const p of W.plats)lo=Math.min(lo,topAt(p,p.s0),topAt(p,p.s1));W.killY=lo-13;
  G.state='play';ui('');showTouch(true);
  const c=$('card');c.hidden=false;c.innerHTML=W.bonus?'<small>Bonus stage. Outrun the whirl</small>Whirl Run':`<small>Stop ${i+1}</small>${LEVELS[i].name}`;setTimeout(()=>c.hidden=true,1900);
  if(K_touch()&&!W.boss&&!W.bonus)toast('Tap anywhere on the right side of the screen to jump.',4);
  if(W.boss)toast('Land on the Keeper\'s head while it is dazed after a slam. Jump the shockwaves.',6);
}
function finishLevel(){
  const L=W.def;if(G.state!=='play')return;G.state='tally';showTouch(false);Sound.win();
  const p=Math.floor(pct());
  if(L.boss){G.cleared=Math.max(G.cleared,3);save();ui(`<h2>The bell is unrung</h2><p>The Keeper falls, the Thirteenth Bell swings once and stops, and the ribbon shakes itself out into Tollbury again. A few roofs are upside down. Nobody mentions it.</p><p class="keys">You finished with ${G.lives} lives. Replay any stop to chase its treasure.</p><div class="row"><button class="big" id="go" type="button">Back to the map</button></div>`,true);$('go').onclick=()=>map();return}
  if(L.bonus){ui(`<h2>You outran the whirl</h2><div class="tally">Whirl treasure <b>${p}%</b></div><div class="row"><button class="big" id="go" type="button">Back to the map</button></div>`,true);$('go').onclick=()=>map();return}
  G.best[G.lvl]=Math.max(G.best[G.lvl]||0,p);G.cleared=Math.max(G.cleared,G.lvl+1);save();
  const next=LEVELS[G.lvl+1];const b=p>=80;
  ui(`<h2>${L.name} cleared</h2><div class="tally">Treasure <b>${p}%</b>${b?'<br>Over 80 percent. The Whirl Run is open.':'<br>Collect 80 percent to open the Whirl Run.'}</div>
   <p class="keys">Stop code for ${next.name}: <kbd>${next.code}</kbd></p>
   <div class="row">${b?'<button class="big" id="bn" type="button">Enter the Whirl Run</button>':''}<button class="${b?'quiet':'big'}" id="go" type="button">Back to the map</button></div>`,true);
  if(b)$('bn').onclick=()=>play(LEVELS.length-1);$('go').onclick=()=>map();
}
function endBonus(){if(G.state!=='play')return;G.state='tally';showTouch(false);Sound.hurt();const p=Math.floor(pct());ui(`<h2>The whirl caught you</h2><div class="tally">Whirl treasure <b>${p}%</b><br>You keep everything you grabbed.</div><div class="row"><button class="big" id="go" type="button">Back to the map</button></div>`,true);$('go').onclick=()=>map()}
function gameOver(){G.state='over';showTouch(false);G.lives=3;ui(`<h2>Out of lives</h2><p>The ribbon keeps your progress. Pick a stop and try again with three fresh lives.</p><div class="row"><button class="big" id="go" type="button">Back to the map</button></div>`,true);$('go').onclick=()=>map()}
function togglePause(){if(G.state==='play'){G.state='pause';ui(`<h2>Paused</h2><div class="row"><button class="big" id="res" type="button">Resume</button><button class="quiet" id="qt" type="button">Quit to the map</button></div>`,true);$('res').onclick=togglePause;$('qt').onclick=()=>map()}else if(G.state==='pause'){G.state='play';ui('')}}
function toggleMute(){Sound.on=!Sound.on;$('muteB').textContent=Sound.on?'Sound on':'Sound off'}
$('pauseB').onclick=togglePause;$('muteB').onclick=()=>{Sound.boot();toggleMute()};

/* ========== Main loop ========== */
let last=0,acc=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000||0);last=now;
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').textContent=''}
  if(G.state==='play'&&!G.headless){acc+=dt;let n=0;while(acc>=1/60&&n<4&&G.state==='play'){step(1/60);acc-=1/60;n++}hud();snapCam(false,dt)}
  else if(G.state==='title'&&P){const f=P.rail.frame(P.s+6+G.t*0);G.t+=dt;P.s=(P.s+dt*1.3);if(P.s>P.rail.len-20)P.s=4;const fl=floorAt(P.rail,P.s,1e3);if(fl)P.y=topAt(fl,P.s);P.vx=4;P.anim+=dt*5;P.ground=true;snapCam(false,dt)}
  if(!G.headless)draw(dt);
}
title();requestAnimationFrame(frame);
window.hullabaloo={G,K,LEVELS,step,play,press,get P(){return P},get W(){return W},draw,snap:snapCam,get scene(){return scene},map,title,pct,floorAt,topAt,CHAR};
</script>
